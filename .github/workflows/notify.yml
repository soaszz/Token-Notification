# Confirmation-only Codex reset notifications.
#
# Reset notifications require a live authenticated `codex app-server` probe on
# the local Windows PC. GitHub Actions cannot authenticate to the ChatGPT Edu
# Codex account, so scheduled cloud notifications based on stored timestamps
# are disabled. The local tracker confirms renewals from Codex data.
#
# This workflow is manual-only: it can send a test message on request and
# otherwise does nothing. No reset decisions are made from cloud state.
name: codex-reset-notify

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test Telegram message"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: codex-reset-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out notifier code
        uses: actions/checkout@v4

      - name: Send test message
        if: ${{ inputs.test }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 notify.py --test

      - name: Confirm cloud notifications are disabled
        if: ${{ !inputs.test }}
        run: |
          echo "Confirmation-only mode: reset notifications require local Codex verification."
          echo "No reset notification was sent from GitHub Actions."